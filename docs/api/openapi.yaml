openapi: 3.1.0
info:
  title: FHES v6.2 學生系統 API
  version: 6.2.0
  description: |
    最小後端（server/）。教師用 Bearer（由 Google ID token 在後端驗證後換得），學生用同源 HttpOnly Cookie。
    - 學生 API 沒有任何身分參數；身分、班級、小組一律由 Session 推得。多帶欄位或 query 一律 400。
    - 學生的寫入請求必須帶 `X-FHES-CSRF`（登入或改密碼時取得）與允許的 `Origin`。
    - 錯誤一律回傳 `{ error, message }`；他班教師存取班級一律 404。
    - 所有回應：`Cache-Control: no-store`、`X-Content-Type-Options: nosniff`、CSP、`X-Frame-Options: DENY`。
servers:
  - url: http://localhost:8790
    description: 本機開發（正式網址需另外批准）
components:
  securitySchemes:
    teacherBearer: { type: http, scheme: bearer, description: "POST /api/teacher/session 換得；只放記憶體，8 小時" }
    studentCookie: { type: apiKey, in: cookie, name: __Host-fhes_sid, description: "HttpOnly、Secure、SameSite=Strict；閒置 2 小時、最長 12 小時" }
    csrf: { type: apiKey, in: header, name: X-FHES-CSRF }
    adminBearer: { type: http, scheme: bearer, description: "POST /api/admin/session 換得；只放記憶體，4 小時；只有 platform_admins" }
  schemas:
    Error:
      type: object
      required: [error, message]
      properties: { error: { type: string }, message: { type: string } }
    Homework:
      type: object
      additionalProperties: false
      properties:
        assignmentId: { type: string }
        title: { type: string, maxLength: 80 }
        type: { type: string }
        assignedDate: { type: [string, "null"], format: date }
        dueDate: { type: [string, "null"], format: date }
        submission: { enum: [unchecked, missing, submitted, exempt], description: "unchecked（未登記）≠ missing（未交）" }
        correction: { enum: [ungraded, needs, done, none, null], description: "只有 submitted 才有；submitted ≠ done" }
        late: { type: boolean }
    StudentDto:
      type: object
      additionalProperties: false
      required: [studentId, seat, name, groupId, score, homework]
      properties:
        studentId: { type: string, description: 教師端本機的學生 ID }
        seat: { type: [integer, "null"] }
        name: { type: string, description: "nameMode=seat 時為「N號」" }
        groupId: { type: [integer, "null"] }
        score: { type: object, additionalProperties: false, properties: { score: { type: integer }, earned: { type: integer } }, description: 不含愛心 }
        homework: { type: array, maxItems: 120, items: { $ref: "#/components/schemas/Homework" } }
    Animal:
      type: object
      additionalProperties: false
      properties:
        itemId: { type: string, description: "圖鑑 ID（land-01…）或特殊收藏 ID（sp-…）" }
        baseItemId: { type: [string, "null"] }
        special: { type: boolean }
        name: { type: string }
        rarity: { enum: [common, rare, epic, legendary] }
        stage: { type: integer, minimum: 0, maximum: 3, description: 只由 XP 決定 }
    GroupDto:
      type: object
      additionalProperties: false
      properties:
        groupId: { type: integer, minimum: 1, maximum: 20 }
        name: { type: string }
        worldId: { type: [string, "null"] }
        xp: { type: integer, minimum: 0 }
        animals: { type: array, items: { $ref: "#/components/schemas/Animal" } }
    Projection:
      type: object
      additionalProperties: false
      required: [schema, className, nameMode, students, groups]
      properties:
        schema: { const: 1 }
        className: { type: string, maxLength: 60 }
        nameMode: { enum: [name, seat] }
        students: { type: array, maxItems: 80, items: { $ref: "#/components/schemas/StudentDto" } }
        groups: { type: array, maxItems: 20, items: { $ref: "#/components/schemas/GroupDto" } }
    CareSummary:
      type: object
      properties:
        total: { type: integer }
        animals: { type: object, additionalProperties: { type: object, properties: { care: { type: integer }, recent: { type: integer }, mood: { enum: [calm, happy, thrilled] } } } }
        badges: { type: array, items: { type: string } }
        nextBadge: { type: [object, "null"] }
        teamStars: { type: integer }
        today: { type: object, properties: { participants: { type: integer }, needed: { type: integer }, members: { type: integer } }, description: 只有人數，沒有名單 }
paths:
  /api/teacher/session:
    post:
      summary: 用 Google ID token 換教師工作階段（每個 token 只能用一次）
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [credential, nonce], properties: { credential: { type: string }, nonce: { type: string } } } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { token: { type: string }, expiresAt: { type: integer } } } } } }
        "401": { description: 簽章、iss、aud/azp、exp、iat（10 分鐘）、nonce、sub 任一不符，或重放 }
        "403": { description: "Origin 不在教師來源清單，或帳號不在 FHES_TEACHER_ALLOW（需 email 已驗證）" }
        "429": { description: 同一 IP 失敗太多次 }
  /api/teacher/logout:
    post: { security: [{ teacherBearer: [] }], summary: 登出（註銷 Bearer）, responses: { "200": { description: OK } } }
  /api/teacher/classes:
    post:
      security: [{ teacherBearer: [] }]
      summary: 建立（或取得）本機班級對應的 classKey；同一位教師同一個本機班級只會有一個
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [localClassId, name], properties: { localClassId: { type: string, maxLength: 64 }, name: { type: string, maxLength: 60 } } } } } }
      responses: { "200": { description: "{ classKey }" }, "401": { description: 未登入 }, "409": { description: 超過每位老師 30 個班級 }, "429": { description: 一天最多連結 10 個新班級 } }
  /api/teacher/classes/{classKey}/accounts:
    parameters: [{ name: classKey, in: path, required: true, schema: { type: string } }]
    get:
      security: [{ teacherBearer: [] }]
      summary: 帳號清單（不含密碼或雜湊）
      responses: { "200": { description: "{ accounts[], publishedAt, version }" }, "404": { description: 不是你的班級 } }
    post:
      security: [{ teacherBearer: [] }]
      summary: 為學生建立帳號；初始密碼只在這次回應出現
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [students], properties: { students: { type: array, maxItems: 80, items: { type: object, additionalProperties: false, required: [localStudentId], properties: { localStudentId: { type: string } } } } } } } } }
      responses: { "200": { description: "{ created: [{accountId, localStudentId, username, initialPassword}], existing: [localStudentId] }" }, "404": { description: 不是你的班級 }, "409": { description: 超過每班 80 個帳號 } }
  /api/teacher/classes/{classKey}/accounts/{accountId}/reset:
    post: { security: [{ teacherBearer: [] }], summary: "重發初始密碼（D3：只限本班發的、還沒有人登入過的帳密，而且該生不能在別位老師的班上）", responses: { "200": { description: "{ accountId, username, initialPassword }" }, "403": { description: "not_issuer（不是本班發的帳密）、other_teacher（也在別位老師的班上）或 already_used（已經登入過；請改用 reset-request）" }, "404": { description: 不是你的班級或帳號 } } }
  /api/teacher/classes/{classKey}/accounts/{accountId}/reset-request:
    post: { security: [{ teacherBearer: [] }], summary: "替本班學生向平台管理員送出重設密碼申請（同一位學生同時只有一筆待審）", responses: { "200": { description: "{ requestId, status: pending, replay }" }, "400": { description: "no_password：這位學生沒有帳號密碼" }, "404": { description: 不是你的班級或帳號 } } }
  /api/teacher/classes/{classKey}/accounts/{accountId}/remove:
    post: { security: [{ teacherBearer: [] }], summary: "移出本班（成員資格立即失效；user、帳密與其他班級不受影響）", responses: { "200": { description: "{ accountId, status: removed }" }, "404": { description: 不是你的班級或帳號 } } }
  /api/teacher/classes/{classKey}/accounts/{accountId}/disable:
    post: { security: [{ teacherBearer: [] }], summary: "停用本班的成員資格（只影響本班；如果這是他唯一有效的班級，已登入的裝置立即登出）", responses: { "200": { description: OK }, "404": { description: 不是你的班級或帳號 } } }
  /api/teacher/classes/{classKey}/accounts/{accountId}/enable:
    post: { security: [{ teacherBearer: [] }], summary: 重新啟用, responses: { "200": { description: OK }, "404": { description: 不是你的班級或帳號 } } }
  /api/teacher/classes/{classKey}/accounts/{accountId}/helper:
    post:
      security: [{ teacherBearer: [] }]
      summary: 指定或取消小老師（立即生效）
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [helper], properties: { helper: { type: boolean } } } } } }
      responses: { "200": { description: "帳號資料（含 helper）" }, "404": { description: 不是你的班級或帳號 } }
  /api/teacher/classes/{classKey}/homework-registrations:
    get:
      security: [{ teacherBearer: [] }]
      summary: 收取小老師登記（依 seq 游標；每次最多 500 筆；保留 120 天）
      parameters: [{ name: after, in: query, required: false, schema: { type: string, pattern: "^[0-9]{1,15}$" } }]
      responses: { "200": { description: "{ registrations: [{seq, id, assignmentId, studentId, state, createdAt, helperStudentId, helperSeat}], next, more }" }, "404": { description: 不是你的班級 } }
  /api/teacher/classes/{classKey}/projection:
    put:
      security: [{ teacherBearer: [] }]
      summary: 發布投影（整班替換，單一交易）
      description: "version 較舊 → 409 stale；同版本同 hash → 200 unchanged；同版本不同 hash → 409；hash 與內容不符 → 400。上限 2 MB。"
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [version, hash, projection], properties: { version: { type: integer, minimum: 1 }, hash: { type: string, pattern: "^[0-9a-f]{64}$" }, projection: { $ref: "#/components/schemas/Projection" }, inboxSeq: { type: integer, minimum: 0, description: "這次發布已包含到第幾筆小老師登記（選填）" } } } } } }
      responses: { "200": { description: "{ version, publishedAt, unchanged, students, groups }" }, "400": { description: 格式或雜湊錯誤 }, "404": { description: 不是你的班級 }, "409": { description: 版本衝突 }, "413": { description: 太大 } }
  /api/teacher/classes/{classKey}/care-summary:
    get: { security: [{ teacherBearer: [] }], summary: 各小組照顧彙總（唯讀）, responses: { "200": { description: "{ groups: [{groupId, name, care: CareSummary}] }" }, "404": { description: 不是你的班級 } } }
  /api/teacher/classes/{classKey}/invitations:
    get: { security: [{ teacherBearer: [] }], summary: "邀請碼清單（最近 60 天；不含代碼原文）", responses: { "200": { description: "{ invitations: [{ id, createdAt, expiresAt, maxUses, usedCount, revoked, active }] }" }, "404": { description: 不是你的班級 } } }
    post:
      security: [{ teacherBearer: [] }]
      summary: 建立邀請碼；代碼只在這次回應出現（每班同時最多 3 個有效）
      requestBody: { required: false, content: { application/json: { schema: { type: object, additionalProperties: false, properties: { expiresInDays: { type: integer, minimum: 1, maximum: 30, default: 7 }, maxUses: { type: integer, minimum: 1, maximum: 200, default: 60 } } } } } }
      responses: { "200": { description: "{ id, code, createdAt, expiresAt, maxUses, usedCount, revoked, active }" }, "404": { description: 不是你的班級 }, "409": { description: 已有 3 個有效的邀請碼 } }
  /api/teacher/classes/{classKey}/invitations/{invitationId}/revoke:
    post: { security: [{ teacherBearer: [] }], summary: 關閉邀請碼（立即失效）, responses: { "200": { description: 邀請碼資料 }, "404": { description: 不是你的班級或邀請碼 } } }
  /api/teacher/classes/{classKey}/join-requests:
    get: { security: [{ teacherBearer: [] }], summary: "待確認的加入申請（只有學生填的名字、座號提示與時間；30 天自動過期）", responses: { "200": { description: "{ requests: [{ id, displayName, seatHint, createdAt }] }" }, "404": { description: 不是你的班級 } } }
  /api/teacher/classes/{classKey}/join-requests/{requestId}/approve:
    post:
      security: [{ teacherBearer: [] }]
      summary: 核准，並指定他是名單上的哪一位本機學生（交易內建立成員資格）
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [localStudentId], properties: { localStudentId: { type: string, maxLength: 64 } } } } } }
      responses: { "200": { description: 新成員的帳號資料 }, "404": { description: 不是你的班級或申請 }, "409": { description: "not_pending、already_bound（這位學生已綁定其他帳號）、already_member、quota" } }
  /api/teacher/classes/{classKey}/join-requests/{requestId}/reject:
    post: { security: [{ teacherBearer: [] }], summary: 拒絕, responses: { "200": { description: OK }, "404": { description: 找不到待審的申請 } } }
  /api/teacher/classes/{classKey}/claim-codes:
    post:
      security: [{ teacherBearer: [] }]
      summary: 為指定的本機學生產生一次性綁定碼（30 天；同一位學生的舊代碼作廢；代碼只在這次回應出現）
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [students], properties: { students: { type: array, minItems: 1, maxItems: 80, items: { type: object, additionalProperties: false, required: [localStudentId], properties: { localStudentId: { type: string } } } } } } } } }
      responses: { "200": { description: "{ codes: [{ localStudentId, code, expiresAt }], existing: [localStudentId] }" }, "404": { description: 不是你的班級 } }
  /api/student/join:
    post:
      security: [{ studentCookie: [], csrf: [] }]
      summary: 用邀請碼申請加入（只產生申請；要等老師選定是哪一位學生）
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [code, displayName], properties: { code: { type: string, maxLength: 32 }, displayName: { type: string, description: "1～20 個字，只給老師參考" }, seatHint: { type: integer, minimum: 1, maximum: 99 } } } } } }
      responses: { "200": { description: "{ status: pending, className, message }（重送同一個申請也是 200）" }, "400": { description: bad_name }, "404": { description: "invalid_code（打錯、過期、用完、已關閉，或老師被停權）" }, "409": { description: "already_member、too_many_requests" }, "429": { description: "代碼輸入錯誤太多次（每個 user 10 次、每個 IP 50 次／15 分鐘）" } }
  /api/student/claim:
    post:
      security: [{ studentCookie: [], csrf: [] }]
      summary: 用個別綁定碼直接成為那一班的那一位學生（一次性）
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [code], properties: { code: { type: string, maxLength: 32 } } } } } }
      responses: { "200": { description: "{ id（我在這一班的代號）, className }" }, "404": { description: invalid_code }, "409": { description: "already_bound、already_member、quota" }, "429": { description: 同 /api/student/join } }
  /api/student/redeem:
    post:
      security: [{ studentCookie: [], csrf: [] }]
      summary: "P3：學生頁的單一代碼欄位。先找個別綁定碼（直接加入），再找班級邀請碼（送出申請）"
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [code], properties: { code: { type: string, maxLength: 32 }, displayName: { type: string, maxLength: 60 }, seatHint: { type: integer, minimum: 1, maximum: 99 } } } } } }
      responses: { "200": { description: "綁定碼：{ kind: claim, id, className }；邀請碼：{ kind: invite, status: pending, className, message }" }, "400": { description: "need_name：是邀請碼但沒有名字（不算輸入錯誤）" }, "404": { description: "invalid_code（計入錯誤次數）" }, "409": { description: "already_member、already_bound、quota、too_many_requests" }, "429": { description: 同 /api/student/join } }
  /api/student/config:
    get: { summary: "P3：學生頁要不要顯示 Google 登入（Client ID 本來就是公開的）", responses: { "200": { description: "{ google: { clientId } | null }" } } }
  /api/student/google:
    post:
      summary: "P3（FHES_STUDENT_GOOGLE=on）：學生用 Google 登入。沒連結過的 Google 帳號回 not_linked；create: true 才建立沒有任何班級的新帳號"
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [credential, nonce], properties: { credential: { type: string, maxLength: 4096 }, nonce: { type: string, minLength: 8, maxLength: 128 }, create: { type: boolean } } } } } }
      responses: { "200": { description: "{ created, csrf } ＋ Set-Cookie（HttpOnly、Secure、SameSite=Strict）" }, "401": { description: "invalid_token、replayed" }, "403": { description: "origin、staff_account（老師或管理員的 Google 帳號）、disabled" }, "404": { description: "not_linked；開關關閉時也是 404" }, "429": { description: "錯誤太多次，或同一個網路 15 分鐘內建立超過 60 個新帳號" } }
  /api/student/identities/google:
    post:
      security: [{ studentCookie: [], csrf: [] }]
      summary: "P3：連結 Google（要目前的密碼＋剛拿到的 Google 憑證）。已經屬於別人 → 409，不合併"
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [credential, nonce, currentPassword], properties: { credential: { type: string }, nonce: { type: string }, currentPassword: { type: string, maxLength: 128 } } } } } }
      responses: { "200": { description: OK }, "400": { description: "wrong_password、no_password" }, "401": { description: "invalid_token、replayed、未登入" }, "403": { description: "staff_account、csrf、origin" }, "409": { description: "identity_taken、already_linked" }, "429": { description: 密碼錯太多次 } }
  /api/student/identities/google/unlink:
    post: { security: [{ studentCookie: [], csrf: [] }], summary: "P3：解除 Google（要目前的密碼；只用 Google 建立、沒有密碼的帳號不能解除）", requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [currentPassword], properties: { currentPassword: { type: string, maxLength: 128 } } } } } }, responses: { "200": { description: OK }, "400": { description: wrong_password }, "409": { description: last_method } } }
  /api/student/password/google-reset:
    post:
      security: [{ studentCookie: [], csrf: [] }]
      summary: "P3（D3）：連結過 Google 的學生忘記密碼時，用剛拿到的 Google 憑證證明本人後設定新密碼；其他 Session 全部失效"
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [credential, nonce, newPassword], properties: { credential: { type: string }, nonce: { type: string }, newPassword: { type: string, maxLength: 128 } } } } } }
      responses: { "200": { description: "{ ok, csrf } ＋ 新的 Set-Cookie" }, "400": { description: "weak_password、no_password" }, "403": { description: "not_linked（不是連結到這個帳號的 Google）" } }
  /api/student/classes/{memberId}/leave:
    post: { security: [{ studentCookie: [], csrf: [] }], summary: 自己退出這一班（立即失效）, parameters: [{ name: memberId, in: path, required: true, schema: { type: string } }], responses: { "200": { description: OK }, "404": { description: 不是你的班級 } } }
  /api/admin/session:
    post:
      summary: "平台管理員用 Google ID token 登入（只有 platform_admins；第一次由 FHES_ADMIN_EMAIL 建立 owner，之後只認身分）。沒設定管理員時 404"
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [credential, nonce], properties: { credential: { type: string }, nonce: { type: string } } } } } }
      responses: { "200": { description: "{ token, expiresAt }（4 小時）" }, "401": { description: "invalid_token 或 replayed" }, "403": { description: not_admin }, "404": { description: 管理 API 未啟用 }, "429": { description: 嘗試太多次 } }
  /api/admin/logout:
    post: { security: [{ adminBearer: [] }], summary: 登出, responses: { "200": { description: OK } } }
  /api/admin/reset-requests:
    get: { security: [{ adminBearer: [] }], summary: "待處理與最近 50 筆的重設申請（14 天未處理自動作廢）", responses: { "200": { description: "{ pending: [ResetRequest], recent: [ResetRequest] }；ResetRequest = { id, status, createdAt, decidedAt, requestedBy, className, memberStatus, username, issuedByThisClass, teacherCount }" } } }
  /api/admin/reset-requests/{requestId}/approve:
    post: { security: [{ adminBearer: [] }], summary: "核准：產生一次性初始密碼（只在這次回應出現），學生所有 Session 失效、必須改密碼、記入稽核", responses: { "200": { description: "{ username, initialPassword }" }, "404": { description: 找不到 }, "409": { description: "not_pending、stale（學生已不在該班）、no_password" } } }
  /api/admin/reset-requests/{requestId}/reject:
    post: { security: [{ adminBearer: [] }], summary: 拒絕, responses: { "200": { description: OK }, "404": { description: 找不到待審的申請 } } }
  /api/admin/teachers:
    get: { security: [{ adminBearer: [] }], summary: "老師名單（不存 email：id、狀態、註冊方式、班級名稱）", responses: { "200": { description: "{ teachers: [{ id, status, signup, createdAt, classes: [name] }] }" } } }
  /api/admin/teachers/{teacherId}/suspend:
    post: { security: [{ adminBearer: [] }], summary: 停權（立即登出；他的邀請碼與綁定碼失效）, responses: { "200": { description: "{ id, status }" }, "404": { description: 找不到 } } }
  /api/admin/teachers/{teacherId}/unsuspend:
    post: { security: [{ adminBearer: [] }], summary: 恢復, responses: { "200": { description: "{ id, status }" }, "404": { description: 找不到 } } }
  /api/admin/audit:
    get: { security: [{ adminBearer: [] }], summary: "最近 200 筆稽核（不含 IP 雜湊）", parameters: [{ name: before, in: query, required: false, schema: { type: string, pattern: "^[0-9]{1,15}$" } }], responses: { "200": { description: "{ events: [{ id, ts, actorKind, actorId, action, target, detail }] }" } } }
  /api/student/login:
    post:
      summary: 學生登入；成功時發新的 Session Cookie（防 session 固定）
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [username, password], properties: { username: { type: string }, password: { type: string } } } } } }
      responses:
        "200": { description: "{ mustChangePassword, csrf }；mustChangePassword=true 時只能改密碼" }
        "401": { description: 帳號或密碼錯誤（帳號不存在、停用也是同一個回應） }
        "403": { description: Origin 不允許 }
        "429": { description: "帳號連續失敗 5 次（1→2→4…最多 15 分鐘）或同 IP 15 分鐘 200 次；嘗試在密碼驗證前就計數；有 Retry-After" }
  /api/student/logout:
    post: { security: [{ studentCookie: [], csrf: [] }], summary: 登出, responses: { "200": { description: OK } } }
  /api/student/password:
    post:
      security: [{ studentCookie: [], csrf: [] }]
      summary: 改密碼（≥8 字、不含帳號、非常見、非單一字元或連號、不同於目前）；成功後所有舊 Session 失效並發新的
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [currentPassword, newPassword], properties: { currentPassword: { type: string }, newPassword: { type: string } } } } } }
      responses: { "200": { description: "{ ok, csrf }" }, "400": { description: 目前密碼錯誤或新密碼太弱 } }
  /api/student/me:
    get: { security: [{ studentCookie: [] }], summary: "目前登入狀態（含 CSRF token）與自己有效的班級", description: "classes[].id 是「我在這一班的代號」（自己的成員 id），用在 /api/student/classes/{memberId}/…；學生端永遠不會收到教師端的 classKey。helper 只在只有一個班級時有意義（舊版學生頁）。", responses: { "200": { description: "{ username（只用 Google 建立的帳號是 null）, mustChangePassword, csrf, hasPassword, google（是否連結 Google）, helper, classes: [{ id, className, helper }], pending: [{ className, since }]（等老師確認的申請，P3） }" }, "401": { description: 未登入或已失效 } } }
  /api/student/classes/{memberId}/dashboard:
    get: { security: [{ studentCookie: [] }], summary: "多班級（v3）：與 /api/student/dashboard 相同，但指定班級", description: "memberId 必須是登入者自己、仍然有效的成員資格，否則一律 404（不透露是否存在）。同樣的 /classes/{memberId}/ 前綴也適用於 homework、zoo、care、helper、helper/register，內容與對應的舊路徑相同。", parameters: [{ name: memberId, in: path, required: true, schema: { type: string, pattern: "^s_[A-Za-z0-9_-]{8,64}$" } }], responses: { "200": { description: 同舊路徑 }, "404": { description: 不是你的班級 } } }
  /api/student/dashboard:
    get: { security: [{ studentCookie: [] }], summary: "我的成長（舊路徑：只有一個有效班級時可用）", responses: { "200": { description: "{ published, className, publishedAt, me: {name, seat, score}, group: {groupId, name, xp, animals}, homeworkSummary }" }, "403": { description: 需要先改密碼 }, "404": { description: "no_class：沒有任何有效班級" }, "409": { description: "choose_class：在好幾個班級，請改用 /api/student/classes/{memberId}/…（舊路徑 homework、zoo、care、helper 也一樣）" } } }
  /api/student/homework:
    get: { security: [{ studentCookie: [] }], summary: 我的作業（最近 60 天）, responses: { "200": { description: "{ published, publishedAt, homework: Homework[] }" } } }
  /api/student/zoo:
    get: { security: [{ studentCookie: [] }], summary: 小組園區, responses: { "200": { description: "{ published, publishedAt, group: GroupDto|null, care: CareSummary, badges, myToday: {used, limit} }" } } }
  /api/student/care:
    post:
      security: [{ studentCookie: [], csrf: [] }]
      summary: 餵食或陪伴所屬小組的動物
      description: "每位學生在每個班級每日（Asia/Taipei）最多 3 次有效（同班跨小組合計；不同班級各自計算）；超過回 counted=false（只播動畫）。同一 idempotencyKey 只算一次。"
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [itemId, action, idempotencyKey], properties: { itemId: { type: string }, action: { enum: [feed, pet] }, idempotencyKey: { type: string, pattern: "^[A-Za-z0-9_-]{8,64}$" } } } } } }
      responses:
        "200": { description: "{ counted, replay, myToday, animal, care }" }
        "404": { description: 動物不在你目前的小組（他組、他班、已撤銷） }
        "409": { description: 沒有小組，或同一 key 用在不同動作 }
  /api/student/helper:
    get:
      security: [{ studentCookie: [] }]
      summary: 小老師：本班名單與作業狀態（不含分數、愛心、小組）
      responses: { "200": { description: "{ published, publishedAt, className, selfId, students: [{studentId, seat, name}], assignments: [{assignmentId, title, type, assignedDate, dueDate}], states: {assignmentId: {studentId: submitted|missing|needs|done|unchecked|exempt}} }" }, "403": { description: 不是小老師 } }
  /api/student/helper/register:
    post:
      security: [{ studentCookie: [], csrf: [] }]
      summary: 小老師登記同學作業（不能登記自己）
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [assignmentId, studentIds, state, idempotencyKey], properties: { assignmentId: { type: string }, studentIds: { type: array, minItems: 1, maxItems: 80, uniqueItems: true, items: { type: string } }, state: { enum: [submitted, missing, needs, done] }, idempotencyKey: { type: string, pattern: "^[A-Za-z0-9_-]{8,64}$" } } } } } }
      responses:
        "200": { description: "{ saved, replay, states }" }
        "400": { description: 狀態不正確或同學不在本班名單 }
        "403": { description: 不是小老師、登記自己、CSRF 或 Origin 不符 }
        "404": { description: 本班沒有這份作業 }
        "409": { description: 同一 key 用在不同的登記 }
        "429": { description: 今天登記太多次（每位小老師每天 3000 筆） }
